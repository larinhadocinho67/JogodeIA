<body>

<script>
'use strict';
/* =====================================================================
   DOCE AVENTURA NAS 4 ESTAÇÕES
   Todos os gráficos são gerados por código (pixel art procedural).
   ===================================================================== */
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const W=960,H=540,G=440,TAU=Math.PI*2;
ctx.imageSmoothingEnabled=false;

/* ---------------- utilidades ---------------- */
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function shade(h,a){const[r,g,b]=hex2rgb(h);if(a>=0)return rgb2hex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);const k=1+a;return rgb2hex(r*k*.94,g*k*.96,b*k*1.04)}
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function ramp(base){return[shade(base,-.5),shade(base,-.3),shade(base,-.13),base,shade(base,.18),shade(base,.38)]}
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16);
const rampCache={};const rp=c=>rampCache[c]||(rampCache[c]=ramp(c));

/* ---------------- ferramentas de pixel art ---------------- */
function tools(g,S){
  const P={g,S};
  P.R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x*S),Math.round(y*S),Math.max(1,Math.round(w*S)),Math.max(1,Math.round(h*S)))};
  P.E=(cx,cy,rx,ry,c)=>{const X=cx*S,Y=cy*S,RX=rx*S,RY=ry*S;g.fillStyle=c;for(let y=Math.floor(Y-RY);y<Y+RY;y++){const dy=(y+.5-Y)/RY;if(dy<=-1||dy>=1)continue;const hw=RX*Math.sqrt(1-dy*dy);const x0=Math.round(X-hw),x1=Math.round(X+hw);if(x1>x0)g.fillRect(x0,y,x1-x0,1)}};
  P.ES=(cx,cy,rx,ry,base,ol)=>{
    if(ol)P.E(cx,cy,rx+1,ry+1,ol);
    const r=rp(base),n=r.length-1,X=cx*S,Y=cy*S,RX=rx*S,RY=ry*S;
    for(let y=Math.floor(Y-RY);y<Y+RY;y++){const dy=(y+.5-Y)/RY;if(dy<=-1||dy>=1)continue;const hw=RX*Math.sqrt(1-dy*dy);const xe=Math.round(X+hw);
      for(let x=Math.round(X-hw);x<xe;x++){const dx=(x+.5-X)/RX;const e=Math.sqrt(dx*dx+dy*dy);
        let l=.62-dx*.28-dy*.38-Math.max(0,e-.7)*.75+(BAY[((y&3)<<2)|(x&3)]-.5)*.2;let i=Math.round(l*n);i=i<0?0:i>n?n:i;g.fillStyle=r[i];g.fillRect(x,y,1,1)}}
  };
  P.T=(pts,base,ol)=>{
    const q=pts.map(p=>[p[0]*S,p[1]*S]);
    const fill=(qq,fn)=>{let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;qq.forEach(p=>{mnX=Math.min(mnX,p[0]);mxX=Math.max(mxX,p[0]);mnY=Math.min(mnY,p[1]);mxY=Math.max(mxY,p[1])});
      const[a,b,c]=qq;const den=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);if(!den)return;
      for(let y=Math.floor(mnY);y<=Math.ceil(mxY);y++)for(let x=Math.floor(mnX);x<=Math.ceil(mxX);x++){const px=x+.5,py=y+.5;
        const l1=((b[1]-c[1])*(px-c[0])+(c[0]-b[0])*(py-c[1]))/den,l2=((c[1]-a[1])*(px-c[0])+(a[0]-c[0])*(py-c[1]))/den,l3=1-l1-l2;
        if(l1>=0&&l2>=0&&l3>=0){g.fillStyle=fn(x,y,mnY,mxY);g.fillRect(x,y,1,1)}}};
    if(ol){const cx=(q[0][0]+q[1][0]+q[2][0])/3,cy=(q[0][1]+q[1][1]+q[2][1])/3;
      const o=q.map(p=>{const d=Math.hypot(p[0]-cx,p[1]-cy)||1,k=1+(1.2*S)/d;return[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k]});fill(o,()=>ol)}
    const r=rp(base),n=r.length-1;
    fill(q,(x,y,mnY,mxY)=>{const f=(y-mnY)/((mxY-mnY)||1);let l=.82-f*.5+(BAY[((y&3)<<2)|(x&3)]-.5)*.2;let i=Math.round(l*n);i=i<0?0:i>n?n:i;return r[i]});
  };
  P.speck=(cx,cy,rx,ry,c,n,len)=>{const rnd=mulberry32(Math.round(cx*131+cy*17+n*7));g.fillStyle=c;for(let i=0;i<n;i++){const a=rnd()*TAU,d=Math.sqrt(rnd());g.fillRect(Math.round((cx+Math.cos(a)*d*rx)*S),Math.round((cy+Math.sin(a)*d*ry)*S),1,Math.max(1,Math.round(len*S*.7)))}};
  P.box=(x,y,w,h,base)=>{const r=rp(base),n=r.length-1;for(let px=Math.round(x*S);px<Math.round((x+w)*S);px++){const u=(px/S-x)/w;for(let py=Math.round(y*S);py<Math.round((y+h)*S);py++){let l=.9-u*.7+(BAY[((py&3)<<2)|(px&3)]-.5)*.18;let i=Math.round(l*n);i=i<0?0:i>n?n:i;g.fillStyle=r[i];g.fillRect(px,py,1,1)}}};
  P.eye=(cx,cy,rx,ry)=>{P.E(cx,cy,rx+.5,ry+.5,'#0b0716');P.E(cx,cy,rx,ry,'#1b1230');P.E(cx,cy+ry*.35,rx*.75,ry*.5,'#4a3a7a');P.E(cx-rx*.3,cy-ry*.35,rx*.42,ry*.36,'#fff');P.E(cx+rx*.35,cy+ry*.4,rx*.2,ry*.18,'#fff')};
  return P;
}
function makeSprite(w,h,S,fn){const c=cv(w*S,h*S);const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(tools(g,S));return c}
function pxLine(g,x0,y0,x1,y1,w,col){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)));g.fillStyle=col;for(let i=0;i<=n;i++){const t=i/n;g.fillRect(Math.round(x0+(x1-x0)*t-w/2),Math.round(y0+(y1-y0)*t-w/2),w,w)}}
function pxDisc(g,cx,cy,r,col){g.fillStyle=col;for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++){const dy=y+.5-cy;if(Math.abs(dy)>r)continue;const hw=Math.sqrt(r*r-dy*dy);const x0=Math.round(cx-hw),x1=Math.round(cx+hw);if(x1>x0)g.fillRect(x0,y,x1-x0,1)}}

function drawTurtle(P,f){

    if(blossom)for(let i=0;i<26;i++){const a=rnd()*TAU,d=Math.sqrt(rnd())*t.r;const x=Math.round(t.x+Math.cos(a)*d),y=Math.round(t.y+Math.sin(a)*d-t.r*.12);g.fillStyle=blossom[(rnd()*blossom.length)|0];if(rnd()<.5)g.fillRect(x,y,2,2);else{g.fillRect(x+1,y,1,3);g.fillRect(x,y+1,3,1)}}});
}
function buildTree(o){
  const c=cv(o.w,o.h),g=c.getContext('2d'),rnd=mulberry32(o.seed),tips=[];
  const seg=(x,y,th)=>{const w=Math.max(2,Math.round(th)),x0=Math.round(x-w/2),y0=Math.round(y),e=w>5?2:1;g.fillStyle=o.bark;g.fillRect(x0,y0,w,3);g.fillStyle=o.barkHi;g.fillRect(x0,y0,e,3);g.fillStyle=o.barkLo;g.fillRect(x0+w-e,y0,e,3);if(w>4&&rnd()<.55){g.fillStyle=o.barkLo;g.fillRect(x0+1+((rnd()*(w-2))|0),y0,1,2+((rnd()*3)|0))}};
  const branch=(x,y,a,len,th,d)=>{let cx=x,cy=y;const n=Math.round(len/2);for(let i=0;i<n;i++){a+=(rnd()-.5)*.1;cx+=Math.cos(a)*2;cy+=Math.sin(a)*2;seg(cx,cy,th*(1-.4*i/n))}
    if(d<=0){tips.push({x:cx,y:cy,r:o.leafR*(.8+rnd()*.5)});return}
    const k=d>2?2:(rnd()<.5?2:3);for(let i=0;i<k;i++){const s=(i-(k-1)/2)*(o.spread*(.8+rnd()*.5))+(rnd()-.5)*.2;branch(cx,cy,a+s,len*(.7+rnd()*.1),th*.7,d-1)}
    if(d<=2&&rnd()<.7)tips.push({x:cx,y:cy,r:o.leafR*.9})};
  for(let i=0;i<12;i++){const w=o.th+i*1.5;g.fillStyle=o.bark;g.fillRect(Math.round(o.w/2-w/2),o.h-18+i,Math.round(w),Math.max(1,i<11?1:7))}
  g.fillStyle=o.bark;g.fillRect(Math.round(o.w/2-o.th/2-8),o.h-6,Math.round(o.th+16),6);

  paintFoliage(g,tips,rnd,o.blossom);
  return c;
}

function startStage(n){
  stage=n;level=buildLevel2(n);state='playing';bannerT=180;camX=0;runCoins=runCoins||0;
  player.x=60;player.y=G-player.h;player.vx=player.vy=0;player.inv=60;player.ride=null;respawn={x:60};fx=[];
  weather=[];const r=mulberry32(n*31),cnt=n===1?80:n===3?55:n===4?170:0;

}
function buildLevel2(n){A=buildAssets(n);B=buildBack(n);addBackTrees(B,n);return buildLevel(n)}
function startGame(){lives=3;runCoins=0;startStage(1)}
function loseLife(){
  if(player.inv>0)return;
  lives--;for(let i=0;i<14;i++)fx.push({x:player.x+20,y:player.y+30,vx:(Math.random()-.5)*6,vy:-Math.random()*5,life:40,col:'#ff6b8b',s:4});
  if(lives<=0){state='gameover';persist();return}

  L.coins.forEach(c=>{if(!c.got&&player.x<c.x+22&&player.x+player.w>c.x&&player.y<c.y+22&&player.y+player.h>c.y){c.got=true;addCoins(1);runCoins++;puff(c.x+10,c.y+10,'#ffe066',4)}});
  L.checks.forEach(c=>{if(!c.on&&player.x>c.x){c.on=true;respawn={x:c.x+10};puff(c.x+10,G-40,'#ffffff',10)}});
  const g=L.goal;if(player.x<g.x+g.w&&player.x+player.w>g.x&&player.y<g.y+g.h&&player.y+player.h>g.y){addCoins(25);runCoins+=25;state='stageclear';persist()}

}

  ctx.save();ctx.translate(-Math.round(camX),0);drawWorld();ctx.restore();
  drawWeather();drawHUD();drawBanner();
  if(state==='stageclear'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('Fase '+stage+' concluída!',W/2,H/2-40,34,'#7bff9a','center');txt('+25 moedas de bônus  |  Moedas guardadas: '+save.coins,W/2,H/2,18,'#ffe066','center');txt('Pressione ESPAÇO para continuar',W/2,H/2+40,18,'#ffffff','center')}
  if(state==='gameover'){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);txt('Fim de jogo!',W/2,H/2-30,40,'#ff6b6b','center');txt('Suas moedas ('+save.coins+') foram guardadas.',W/2,H/2+10,18,'#ffe066','center');txt('Pressione ESPAÇO para voltar ao menu',W/2,H/2+46,18,'#ffffff','center')}
}

/* =====================================================================
   ENTRADA
   ===================================================================== */
let fsAuto=false;
function autoFS(){if(fsAuto)return;fsAuto=true;try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
window.addEventListener('pointerdown',autoFS);
window.addEventListener('keydown',autoFS);
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}}
function tryBuy(i){
  const c=CHARS[i];
  if(save.unlocked[c.id]){save.selected=c.id;persist();msg='Personagem selecionado: '+c.name;msgT=90;return}
  if(save.coins>=c.price){save.coins-=c.price;save.unlocked[c.id]=true;save.selected=c.id;persist();msg='Você comprou '+c.name+'!';msgT=120}
  else{msg='Faltam '+(c.price-save.coins)+' moedas para comprar '+c.name;msgT=120}
}
function activate(id){
  if(id==='play')startGame();
  else if(id==='chars'){state='chars';charSel=CHARS.findIndex(c=>c.id===save.selected)}
  else if(id==='back')state='title';
  else if(id.startsWith('card'))tryBuy(+id.slice(4));
}
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyF'&&state!=='playing'||e.code==='F11'||(e.code==='KeyF'&&e.shiftKey)){e.preventDefault();toggleFS();return}
  const ok=e.code==='Enter'||e.code==='Space';
  if(state==='title'){if(e.code==='ArrowDown'||e.code==='ArrowUp')titleSel=(titleSel+1)%2;if(ok)activate(titleBtns()[titleSel].id)}
  else if(state==='chars'){
    if(e.code==='ArrowRight')charSel=charSel>=4?0:(charSel+1)%4;if(e.code==='ArrowLeft')charSel=charSel>=4?3:(charSel+3)%4;
    if(e.code==='ArrowDown')charSel=4;if(e.code==='ArrowUp'&&charSel===4)charSel=0;
    if(ok)activate(charSel===4?'back':'card'+charSel);if(e.code==='Escape'||e.code==='Backspace')state='title'}
  else if(state==='playing'){if(e.code==='Escape'){persist();state='title'}}
  else if(state==='stageclear'){if(ok){if(stage>=4){state='victory';confetti=[]}else startStage(stage+1)}}
  else if(state==='gameover'||state==='victory'){if(ok||e.code==='Escape'){state='title';candy&&0}}
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
canvas.addEventListener('mousemove',e=>{const p=mpos(e);mouse.x=p.x;mouse.y=p.y;let hand=false;
  if(state==='title'){titleBtns().forEach((b,i)=>{if(inR(b,p.x,p.y)){titleSel=i;hand=true}})}
  if(state==='chars'){CHARS.forEach((c,i)=>{if(inR(cardR(i),p.x,p.y)){charSel=i;hand=true}});if(inR(backBtn,p.x,p.y)){charSel=4;hand=true}}
  canvas.style.cursor=hand?'pointer':'default'});
canvas.addEventListener('click',e=>{const p=mpos(e);
  if(state==='title'){titleBtns().forEach(b=>{if(inR(b,p.x,p.y))activate(b.id)})}
  else if(state==='chars'){CHARS.forEach((c,i)=>{if(inR(cardR(i),p.x,p.y)){charSel=i;activate('card'+i)}});if(inR(backBtn,p.x,p.y))activate('back')}
  else if(state==='stageclear'||state==='gameover'||state==='victory'){window.dispatchEvent(new KeyboardEvent('keydown',{code:'Enter'}))}
});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
window.addEventListener('beforeunload',persist);

/* =====================================================================
   INÍCIO
   ===================================================================== */
loadSave();buildUITiles();buildCharSprites();buildEnemySprites();buildCoinFrames();buildMisc();
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(100,now-last);last=now;while(acc>=DT){update();acc-=DT}draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
